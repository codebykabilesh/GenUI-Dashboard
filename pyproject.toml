[project]
name = "genui-mcp-runtime"
version = "0.1.0"
description = "FastAPI MCP Host/Runtime for the GenUI application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp[apps]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jsonschema>=4",
    "deno>=2.9.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
